[project]
name = "m5-petit-app"
version = "0.2.0"
description = "Dashboard server for M5 Petit — album, voice memo, notebook, mailbox, M5 watcher (N characters, Phase A)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
    "Pillow>=10.0.0",
    "websockets>=13.0",
]

[project.scripts]
m5-petit-app = "main:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Flat-layout single-file app (main.py at repo root, no src/ package dir) —
# tell hatchling explicitly what to ship instead of relying on its
# name-matches-a-directory heuristic.
include = ["main.py", "scripts/*.py"]
